name: Construction et deploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier les contrastes et le daltonisme
        run: node scripts/verifier-contrastes.mjs

      - name: Construire le site
        uses: withastro/action@v3
        with:
          # L'action tourne en Node 20 par defaut, Astro 7 exige >=22.12
          # (voir `engines` dans package.json).
          node-version: 22
        env:
          PUBLIC_CLE_FORMULAIRE: ${{ secrets.CLE_FORMULAIRE }}

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
